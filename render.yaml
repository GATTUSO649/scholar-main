services:
  - type: web
    name: scholar-desk
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: scholar-desk-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: HOST
        value: 0.0.0.0
      - key: MYSQL_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: FILE_STORAGE_DIR
        value: /var/data/uploads
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
