services:
  - type: web
    name: scholar-desk
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: scholar-desk-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MIGRATION_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: MPESA_ENV
        value: production
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerBuyGoodsOnline
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_STK_QUERY_ENABLED
        value: "true"
      - key: ADMIN_SIGNUP_SECRET
        sync: false
      - key: REQUEST_MAX_FILE_BYTES
        value: "20971520"
      - key: REQUEST_MAX_TOTAL_BYTES
        value: "52428800"
      - key: DOCUMENT_MAX_FILE_BYTES
        value: "26214400"
      - key: DOCUMENT_MAX_TOTAL_BYTES
        value: "52428800"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
